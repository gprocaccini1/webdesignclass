<!DOCTYPE html>
<html>
    <head>
        <!--Comments are written like this.-->
        <title>Poem Practice</title>
        <!--rel means relationship (what kind of file is it?) href means where is this file?-->
        <!--Here i am connecting the css to this index file using the link tag-->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>The bottoms of my <span class="pink">shoes</span></h1>
        <h2>By <a href="https://en.wikipedia.org/wiki/Jack_Kerouac" target="_blank"> Jack Kerouac</a></h2>
        <img src="images/walking01.jpg" alt="repeating shoes walking" class="fadetop">
        <p>The bottoms of my shoes</p>
        <img src="images/walking02.jpg" alt="repeating shoes walking" class="fademiddle">
        <p class="indent">are clean</p>
         <img src="images/walking03.jpg" alt="repeating shoes walking" class="fadelast">
        <p class="indentmore">From walking in the rain</p>
         <img src="images/walking04.jpg" alt="repeating shoes walking">
         <h6>Photo by Eadweard Muybridge, 1887</h6>
    </body>
</html>
