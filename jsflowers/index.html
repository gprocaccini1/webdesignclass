<!DOCTYPE html>
<html>
    <head>
        <title>JS Flower Site</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section id="sunflowersgroup">
            <div id="sunhover" class="sunflower animate__animated animate__jackInTheBox">
                <img src="images/sunflower.png" alt="sunflower">
            </div>
            <div class="sunflower animate__animated animate__zoomInUp">
                <img src="images/sunflower.png" alt="sunflower">
            </div>
            <div class="sunflower animate__animated animate__jackInTheBox">
                <img src="images/sunflower.png" alt="sunflower">
            </div>
            <div class="sunflower suntarget">
                <img src="images/sunflower.png" alt="sunflower">
            </div>
            <div class="sunflower suntarget">
                <img src="images/sunflower.png" alt="sunflower">
            </div>
        </section>
        <section id="textgroup">
            <div id="roseclick" class="rose">
                <img src="images/rose.png" alt="rose">
            </div>
            <div  id="daisyclick" class="daisy">
                <img src="images/daisy.png" alt="daisy">
            </div>
            <div class="rosetext">
                <h2>A rose is either a woody perennial flowering plant of the genus Rosa in the family Rosaceae or the flower it bears</h2>
            </div>
            <div class="daisytext">
                <h2>The flowers called daisy include a central, buttonlike disc of microscopic flowers encompassed by a ring of raylike petals.</h2>
            </div>
        </section>
        <script src="script.js"></script>
    </body>
</html>
